[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "declaration-qa"
version = "0.1.0"
description = "Declaration QA workflow service"
requires-python = ">=3.10"
dependencies = [
    "dashscope",
    "langfuse>=4.0.0",
    "pymupdf>=1.24",
    "python-calamine>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
