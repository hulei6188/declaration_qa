[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "declaration-qa"
version = "0.1.0"
description = "Declaration QA workflow service"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "starlette==0.41.3",
    "uvicorn==0.34.0",
    "python-multipart==0.0.20",
    "pydantic==2.10.4",
    "pydantic-settings==2.14.1",
    "eval_type_backport==0.2.2",
    "SQLAlchemy==2.0.36",
    "psycopg[binary]==3.3.4",
    "python-jose[cryptography]==3.3.0",
    "pymilvus==2.6.15",
    "redis==5.2.1",
    "rq==2.1.0",
    "requests==2.34.2",
    "elasticsearch==8.19.2",
    "langchain==0.3.27",
    "langchain-core==0.3.80",
    "langchain-community==0.3.31",
    "langchain-openai==0.3.35",
    "langgraph==0.6.11",
    "dashscope",
    "langfuse>=4.0.0",
    "pymupdf>=1.24",
    "pypdf>=5.6.0,<7.0.0",
    "python-calamine>=0.4.0",
    "marko>=2.2,<3",
    "chonkie>=1.7,<2",
    "ragas==0.3.9",
]

[project.optional-dependencies]
parsing = [
    "mineru[pipeline]",
    "llama-cloud-services>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
